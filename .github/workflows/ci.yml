name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token and no repository secrets anywhere in this file: it is safe to run on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Fast feedback that needs neither Docker nor a database.
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Exercise library is reproducible and duplicate-free
        run: npm run exercises:check
      - name: Video prompts are up to date
        run: npm run videos:check
      - name: Food review sheet is up to date
        run: npm run foods:review:check

  # Everything that talks to a real Supabase (RLS, webhooks, realtime, storage) plus the browser flows.
  integration-e2e:
    name: Integration, RLS and E2E (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0          # exact CLI version; bump deliberately (Dependabot cannot see this input)
      - name: Start local Supabase (applies supabase/migrations)
        run: supabase start -x studio,logflare,vector,edge-runtime
      - name: Write .env.local from the running stack
        run: supabase status -o json 2>/dev/null | node scripts/ci/write-env.mjs > .env.local
      - name: Load the exercise library
        run: npm run exercises:seed
      - name: Load the food library
        run: npm run foods:seed

      - name: Integration tests (RLS, billing, realtime, storage, AI limits)
        run: npm run test:int
      - name: Row-level security SQL checks
        run: docker exec -i supabase_db_training-os psql -U postgres -v ON_ERROR_STOP=1 < supabase/rls_test.sql

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: E2E (production build served locally, Chromium)
        env:
          E2E_BROWSER: chromium
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
